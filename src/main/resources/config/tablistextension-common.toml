# TabListExtension配置文件

[dimensions]
# 维度颜色和前缀配置

[dimensions.overworld]
enabled = true
color = "GREEN"  # 可用颜色: BLACK, DARK_BLUE, DARK_GREEN, DARK_AQUA, DARK_RED, DARK_PURPLE, GOLD, GRAY, DARK_GRAY, BLUE, GREEN, AQUA, RED, LIGHT_PURPLE, YELLOW, WHITE

[dimensions.nether]
enabled = true
color = "DARK_RED"

[dimensions.end]
enabled = true
color = "DARK_PURPLE"

[dimensions.other]
enabled = true
color = "WHITE"

[general]
# 是否在TAB列表中显示维度前缀
show_prefix = true

# 是否按维度对玩家进行分组显示
group_by_dimension = true

# 服务器向客户端发送更新的间隔（以tick为单位，20tick = 1秒）
update_interval = 10

# 是否显示玩家延迟（ping）
show_ping = true

# TAB列表的标题文本
header_text = "玩家列表"

# 每页显示的最大玩家数量
max_players_per_page = 80

# 是否启用分页功能
enable_pagination = true

# 是否显示页面指示器
show_page_indicator = true